[package]
name = "img-tui"
version = "0.3.1"
edition = "2024"
rust-version = "1.90"
license = "MIT"
description = "Terminal image capability detection and image protocol rendering for TUI apps"
repository = "https://github.com/WindustH/img-tui"

[features]
default = []
cache = ["dep:zstd", "dep:moka", "dep:rusqlite", "dep:sha2", "dep:tempfile"]
terminal = ["dep:framework-tui"]
chafa = ["tokio/process", "dep:ansi-to-tui"]

[dependencies]
framework-tui = { git = "https://github.com/WindustH/framework-tui", rev = "2c17ca9535f640bcee4178f1be731e323dd3d95e", optional = true }
ansi-to-tui = { version = "8.0.1", optional = true }
zstd = { version = "0.13.3", features = ["zstdmt"], optional = true }
moka = { version = "0.12.16", features = ["sync"], optional = true }
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
sha2 = { version = "0.11", optional = true }
tempfile = { version = "3", optional = true }
anyhow = "1.0.103"
base64 = "0.22.1"
crossterm = "0.29.0"
fast_image_resize = "6.0.0"
image = "0.25.10"
libc = "0.2.186"
moxcms = "0.8.1"
palette = "0.7.6"
quantette = "0.6.0"
ratatui = "0.30.2"
rayon = "1.12.0"
tokio = { version = "1.52.3", features = ["rt", "sync"] }
tracing = "0.1.44"
unicode-width = "0.2.2"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
dbg_macro = "warn"

[lib]
test = false
doctest = false
